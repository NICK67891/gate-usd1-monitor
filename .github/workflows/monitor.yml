name: USD1 Monitor

on:
  schedule:
    # 每 5 分钟启动一次；配合 concurrency 自动取消上一轮，实现近乎连续的云端监控
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "Continuous run time (minutes)"
        default: "4"
      test_notify:
        description: "Send test notification (1=yes)"
        default: "0"

concurrency:
  group: gate-monitor
  cancel-in-progress: true

permissions:
  issues: write
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '4' }}
          TEST_NOTIFY: ${{ github.event.inputs.test_notify || '0' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor_cloud.py
