name: USDT APY Monitor

on:
  push:
    branches: [main]
    paths:
      - 'usdt_apy_monitor.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  usdt-apy-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run USDT APY monitor
        run: python usdt_apy_monitor.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          APY_THRESHOLD: '0.05'
