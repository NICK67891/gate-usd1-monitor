name: USDT APY Monitor

# True 5-minute monitoring via self-chaining sessions.
#
# GitHub heavily throttles */5 cron schedules on this repo (observed ~94 min
# average intervals), so a plain cron cannot deliver 5-minute checks.
# Instead:
#   1. Each session runs a ~5h40m loop that checks APY every 5 minutes
#      (and emails when APY > threshold).
#   2. Right before ending, the session dispatches the next session via the
#      built-in GITHUB_TOKEN. Per GitHub docs, workflow_dispatch is the
#      documented exception that always creates a new run even when triggered
#      by GITHUB_TOKEN - so the chain never breaks.
#   3. An hourly cron acts as a watchdog: if the chain died, it starts a new
#      full session (deduplicated away when a session is already running).
#
# Test mode: dispatch with test_mode=true and an overriding threshold to run
# a single check that sends a real alert email, without touching the chain.

on:
  schedule:
    - cron: '0 * * * *'  # watchdog only; real pace comes from chaining
  workflow_dispatch:
    inputs:
      from_run:
        description: 'run_number of the session that dispatched this one'
        required: false
        default: ''
      test_mode:
        description: 'Single-shot test: one check + one real email, no dedup, no chaining'
        type: boolean
        default: false
      threshold:
        description: 'Override APY threshold as decimal (e.g. 0.04). Test only.'
        required: false
        default: ''

permissions:
  actions: write  # query active runs + dispatch next session
  contents: read  # checkout

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # hard cap is 360 (6h); loop itself is ~5h40m
    steps:
      - name: Deduplicate (skip if another session is already active)
        id: dedup
        if: inputs.test_mode != true  # test runs bypass dedup on purpose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MY_RUN="${{ github.run_number }}"
          FROM_RUN="${{ github.event.inputs.from_run || '0' }}"
          ACTIVE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/usdt_apy_monitor.yml/runs?per_page=30" \
            | jq --argjson my "$MY_RUN" --argjson from "$FROM_RUN" \
              '[.workflow_runs[] | select(.run_number != $my and .run_number != $from and (.status == "in_progress" or .status == "queued" or .status == "waiting"))] | length')
          echo "active sessions: $ACTIVE (my=$MY_RUN dispatched_by=$FROM_RUN)"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.dedup.outputs.active == '0' || inputs.test_mode == true
      - uses: actions/setup-python@v5
        if: steps.dedup.outputs.active == '0' || inputs.test_mode == true
        with:
          python-version: '3.12'

      - name: Monitor loop (check every 5 minutes for ~5h40m)
        if: steps.dedup.outputs.active == '0' || inputs.test_mode == true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          APY_THRESHOLD: ${{ inputs.threshold || '0.05' }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "TEST MODE: single check with threshold $APY_THRESHOLD"
            python usdt_apy_monitor.py
          else
            END=$((SECONDS + 20400))
            while [ $SECONDS -lt $END ]; do
              python usdt_apy_monitor.py || echo "$(date -u +%FT%TZ) check failed - will retry in 5 min"
              sleep 300
            done
          fi

      - name: Chain next session (dispatch)
        if: steps.dedup.outputs.active == '0' && inputs.test_mode != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/usdt_apy_monitor.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"from_run\":\"${{ github.run_number }}\"}}"
          echo "next session dispatched"
